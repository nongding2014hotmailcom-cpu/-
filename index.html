<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <!-- นำเข้าฟอนต์ Prompt เพื่อให้แสดงผลภาษาไทยสวยงาม -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #ff4b6e;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .emoji-display {
            font-size: 80px;
            margin: 20px 0;
            display: block;
        }
        /* สไตล์ปุ่มกดไปยังลิงก์เพลง */
        .btn-link {
            display: inline-block;
            background-color: #ff4b6e;
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
            width: 70%;
        }
        .btn-link:hover {
            background-color: #e03e5d;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>ถามคำถามหน่อยนะ 🫣</h1>
        <span class="emoji-display">🫰</span>
        <p>
            เธอคนนี้มีหวานใจหรือยังครับ? ขอจีบสาวคนนี้ได้ไหมนะ 😳<br>
            <span style="color: #ff4b6e; font-size: 14px; font-weight: 600;">(เย้! ดีใจจังเลย 🥰 งั้นตั้งแต่วันนี้ไป เค้าขอเดินหน้าจีบสาวคนนี้อย่างเป็นทางการเลยนะ! 💖)</span>
        </p>
        
        <!-- เปลี่ยนลิงก์เพลงของคุณที่ช่อง href="..." ด้านล่างนี้ได้เลยครับ -->
        <a href="https://youtube.com" target="_blank" class="btn-link">🎵 กดตรงนี้เพื่อฟังเพลงนะ</a>
    </div>

</body>
</html>
